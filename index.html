    async function ranking(){unsubscribeMonth?.();unsubscribeMonth=null;unsubscribePrevious?.();unsubscribePrevious=null;unsubscribeHistory.forEach(unsub=>unsub());unsubscribeHistory=[];unsubscribeSettings?.();unsubscribeSettings=null;currentMonth=null;app.innerHTML=`<div class="crumb"><button id="rankingHome">Accueil</button><span>›</span><b>Classement des mauvais payeurs</b></div><div class="page-title"><div><h1>Classement des mauvais payeurs</h1><p>Classement selon le nombre de mois où la facture a été marquée payée.</p></div></div><div class="ranking-empty">Chargement du classement…</div>`;document.querySelector('#rankingHome').onclick=home;try{const snapshots=await Promise.all(months.map((_,i)=>getDoc(monthRef(i))));const people=new Map();snapshots.forEach((snap,mi)=>{if(!snap.exists())return;const data=normalizeMonth(snap.data());data.people.forEach(person=>{const key=person.name.trim().toLocaleLowerCase('fr');if(!key)return;let entry=people.get(key);if(!entry){entry={name:person.name,paidMonths:0,presentMonths:0};people.set(key,entry)}entry.presentMonths++;if(person.paid)entry.paidMonths++})});const sorted=[...people.values()].sort((a,b)=>a.paidMonths-b.paidMonths||(a.paidMonths/a.presentMonths)-(b.paidMonths/b.presentMonths)||a.name.localeCompare(b.name,'fr'));const list=sorted.length?`<div class="ranking-list">${sorted.map((p,index)=>`<div class="ranking-item"><span class="ranking-place">${index+1}</span><div><span class="ranking-name">${esc(p.name)}</span><span class="ranking-detail">${p.paidMonths} mois payé${p.paidMonths>1?'s':''} sur ${p.presentMonths} mois inscrit${p.presentMonths>1?'s':''}</span></div><span class="ranking-score">${p.presentMonths?Math.round(p.paidMonths/p.presentMonths*100):0}%</span></div>`).join('')}</div>`:'<div class="ranking-empty">Aucune personne n’a encore été ajoutée aux tableaux de 2026.</div>';app.querySelector('.ranking-empty')?.remove();app.insertAdjacentHTML('beforeend',list)}catch(e){console.error(e);const empty=app.querySelector('.ranking-empty');if(empty)empty.textContent=errorText(e)}}
    function home(){unsubscribeMonth?.();unsubscribeMonth=null;unsubscribePrevious?.();unsubscribePrevious=null;unsubscribeHistory.forEach(unsub=>unsub());unsubscribeHistory=[];unsubscribeSettings?.();unsubscribeSettings=null;currentMonth=null;app.innerHTML=`<div class="hero"><div class="hero-copy"><div class="eyebrow">La vie du bar, bien rangée</div><h1>Les bons comptes<br>font les bonnes<br>soirées.</h1><p>Le carnet de bord de l’équipe : retrouvez les personnes et les produits, mois après mois.</p><button class="year-button" id="yearButton" aria-expanded="${monthsExpanded}">2026 <span>${monthsExpanded?'⌄':'→'}</span></button></div><img class="hero-logo" src="./popote-logo.png" alt="Logo Popote & Cie : un cuisinier à la taverne avec une bière et les comptes du bar"></div><div class="ranking-wrap"><button class="ranking-card" id="rankingButton"><img src="./mauvais-payeur.png" alt="Classement des mauvais payeurs : un client couronné entouré de pièces et d'une ardoise"><span>Voir le classement des mauvais payeurs →</span></button></div>${monthsExpanded?`<div class="section-head"><div><h2>Une année au comptoir</h2><p>Choisissez un mois pour consulter son tableau.</p></div><span class="badge">ANNÉE 2026</span></div><div class="months">${months.map((m,i)=>`<button class="month-card" data-month="${i}"><strong>${m}</strong><span class="month-num">${String(i+1).padStart(2,'0')} <span class="month-arrow">↗</span></span></button>`).join('')}</div>`:''}${!logged?'<div class="notice">Consultation ouverte à tous. La gestion du carnet est réservée à l’administrateur.</div>':''}`;document.querySelector('#yearButton').onclick=()=>{monthsExpanded=!monthsExpanded;home();if(monthsExpanded)document.querySelector('.section-head').scrollIntoView({behavior:'smooth',block:'start'})};document.querySelector('#rankingButton').onclick=ranking;document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>loadMonth(+b.dataset.month));updateAdminButton()}
    function month(i){currentMonth=i;const d=monthData(i),editable=isAdmin();logged=editable;app.innerHTML=`<div class="crumb"><button id="goHome">Accueil</button><span>›</span><b>2026</b><span>›</span><b style="text-transform:capitalize">${months[i]}</b></div><div class="page-title"><div><h1>${months[i]} <span style="color:#9ba397">2026</span></h1><p>Le tableau de bord du mois au bar.</p></div>${editable?`<div class="actions"><button class="secondary" id="copyPeople" ${i===0?'disabled title="Aucun mois précédent dans 2026"':''}>Copier le personnel</button><button class="secondary" id="copyProducts" ${i===0?'disabled title="Aucun mois précédent dans 2026"':''}>Copier les produits</button><button class="secondary" id="addPerson"><span>＋</span> Ajouter un personnel</button><button class="primary" id="addProduct"><span>＋</span> Ajouter produit</button></div>`:''}</div><section class="sheet-wrap"><div class="sheet-top"><h2>Personnel & produits</h2><span>${d.people.length} personne${d.people.length!==1?'s':''} · ${d.products.length} produit${d.products.length!==1?'s':''}</span></div><div id="sheet"></div></section>${!editable?'<div class="notice">Connectez-vous en tant qu’administrateur pour ajouter ou modifier des éléments.</div>':''}`;document.querySelector('#goHome').onclick=home;if(editable){document.querySelector('#addPerson').onclick=()=>personModal(i);document.querySelector('#addProduct').onclick=()=>productModal(i);document.querySelector('#copyPeople').onclick=()=>copyFromPrevious(i,'people');document.querySelector('#copyProducts').onclick=()=>copyFromPrevious(i,'products')}renderSheet(i);updateAdminButton()}
    function renderSheet(i){
      const d=monthData(i),s=document.querySelector('#sheet');if(!s)return;
      if(!d.people.length&&!d.products.length){s.innerHTML='<div class="empty"><div class="empty-icon">▦</div><strong>Le tableau est encore vide</strong><p>Ajoutez du personnel et des produits pour commencer.</p></div>';return}
      const editable=isAdmin();
      const productHeads=d.products.length?d.products.map((p,j)=>`<th>${esc(p.name)}${editable?` <button data-edit="${j}" title="Modifier le prix" style="border:0;background:none;color:#87917f">✎</button><button data-del-product="${j}" title="Supprimer ce produit" style="border:0;background:none;color:#a05b50">×</button>`:''}<br><span style="font-weight:500;text-transform:none;letter-spacing:0;color:#899286">${money(p.price)}</span></th>`).join(''):'<th>Produits</th>';
      const totalColumns=1+Math.max(1,d.products.length)+5;
      const previousData=i>0?monthData(i-1):null;
      const personRows=d.people.length?d.people.map((person,pi)=>{
        const quantities=d.products.length?d.products.map((product,pj)=>{const quantity=Number(person.quantities?.[pj])||0;return `<td>${editable?`<input class="qty-input" type="number" min="0" step="1" value="${quantity}" aria-label="Consommation de ${esc(person.name)} : ${esc(product.name)}" data-qty-person="${pi}" data-qty-product="${pj}">`:`<span>${quantity}</span>`}</td>`}).join(''):'<td class="muted-cell">Ajoutez un produit</td>';
        const total=d.products.reduce((sum,product,pj)=>sum+(Number(person.quantities?.[pj])||0)*(Number(product.price)||0),0);
        const previousPerson=previousData?.people.find(p=>p.name.trim().toLowerCase()===person.name.trim().toLowerCase());
        const previousTotal=i===5?(person.previousAmount??null):previousPerson&&!previousPerson.paid?invoiceTotal(i-1,previousPerson):null;
        const previousCell=i===5?`<td><div class="advance-field"><input class="advance-input" type="number" min="0" step="0.01" value="${person.previousAmount??''}" data-previous-manual="${pi}" aria-label="Montant du mois précédent de ${esc(person.name)} en euros" ${editable?'':'disabled'}><span class="advance-euro">€</span></div></td>`:`<td class="total-cell">${previousTotal===null?'<span class="muted-cell">—</span>':money(previousTotal)}</td>`;
        const modes=[...new Set([...cache.paymentModes,...(person.paymentMode&&!cache.paymentModes.includes(person.paymentMode)?[person.paymentMode]:[])])];
        const paymentOptions=`<option value="">Choisir…</option>${modes.map(mode=>`<option value="${esc(mode)}" ${person.paymentMode===mode?'selected':''}>${esc(mode)}</option>`).join('')}${editable?'<option value="__add__">＋ Ajouter un mode…</option>':''}`;
        const netTotal=total+(Number(previousTotal)||0)-(Number(person.advance)||0);
        return `<tr class="person-row" data-person-row="${pi}"><td><div class="person-cell">${editable?`<span class="drag-handle" draggable="true" data-drag-person="${pi}" title="Glisser pour changer l’ordre" aria-label="Déplacer ${esc(person.name)}">⠿</span>`:''}<span class="avatar">${esc(initials(person.name))}</span>${esc(person.name)}${editable?` <button data-del-person="${pi}" title="Supprimer cette personne" style="margin-left:auto;border:0;background:none;color:#a05b50">×</button>`:''}</div></td>${quantities}${previousCell}<td><div class="advance-field"><input class="advance-input" type="number" min="0" step="0.01" value="${Number(person.advance)||0}" data-advance="${pi}" aria-label="Avance de ${esc(person.name)} en euros" ${editable?'':'disabled'}><span class="advance-euro">€</span></div></td><td><select class="payment-select" data-payment="${pi}" ${editable?'':'disabled'}>${paymentOptions}</select></td><td class="pay-cell"><input type="checkbox" data-paid="${pi}" aria-label="Facture payée pour ${esc(person.name)}" ${person.paid?'checked':''} ${editable?'':'disabled'}></td><td class="total-cell">${money(netTotal)}</td></tr>`;
      }).join(''):`<tr><td colspan="${totalColumns}" style="color:#9aa194;padding:25px">Aucun membre du personnel pour le moment.</td></tr>`;
      s.innerHTML=`<div class="table-scroll"><table><thead><tr><th>Personnel</th>${productHeads}<th>Mois précédent</th><th>Avance</th><th>Mode de paiement</th><th>Payé</th><th>Total facture</th></tr></thead><tbody>${personRows}</tbody></table></div>`;
      s.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>productModal(i,+b.dataset.edit));
      s.querySelectorAll('[data-del-person]').forEach(b=>b.onclick=async()=>{d.people.splice(+b.dataset.delPerson,1);await save(i)});
      s.querySelectorAll('[data-del-product]').forEach(b=>b.onclick=async()=>{const j=+b.dataset.delProduct;d.products.splice(j,1);d.people.forEach(person=>person.quantities.splice(j,1));await save(i)});
      s.querySelectorAll('[data-qty-person]').forEach(input=>input.onchange=async()=>{const pi=+input.dataset.qtyPerson,pj=+input.dataset.qtyProduct,quantities=d.people[pi].quantities;while(quantities.length<=pj)quantities.push(0);quantities[pj]=Math.max(0,Math.floor(Number(input.value)||0));await save(i)});
      s.querySelectorAll('[data-paid]').forEach(input=>input.onchange=async()=>{d.people[+input.dataset.paid].paid=input.checked;await save(i)});
      s.querySelectorAll('[data-advance]').forEach(input=>input.onchange=async()=>{const person=d.people[+input.dataset.advance],amount=Math.max(0,Number(input.value)||0);person.advance=Number(amount.toFixed(2));input.value=person.advance;await save(i)});
      s.querySelectorAll('[data-previous-manual]').forEach(input=>input.onchange=async()=>{const person=d.people[+input.dataset.previousManual];person.previousAmount=input.value===''?null:Number(Math.max(0,Number(input.value)||0).toFixed(2));input.value=person.previousAmount??'';await save(i)});
      s.querySelectorAll('[data-payment]').forEach(select=>select.onchange=()=>{const pi=+select.dataset.payment;if(select.value==='__add__'){paymentModeModal(i,pi);return}d.people[pi].paymentMode=select.value;save(i)});
      if(editable){
        s.querySelectorAll('[data-drag-person]').forEach(handle=>handle.addEventListener('dragstart',e=>{
          const row=handle.closest('[data-person-row]');
          e.dataTransfer.effectAllowed='move';
          e.dataTransfer.setData('text/plain',handle.dataset.dragPerson);
          row.classList.add('dragging');
        }));
        s.querySelectorAll('[data-person-row]').forEach(row=>{
          row.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';row.classList.add('drag-over')});
          row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
          row.addEventListener('drop',async e=>{
            e.preventDefault();row.classList.remove('drag-over');
            const from=Number(e.dataTransfer.getData('text/plain')),to=Number(row.dataset.personRow);
            if(!Number.isInteger(from)||from===to||from<0||from>=d.people.length)return;
            const [person]=d.people.splice(from,1);d.people.splice(to,0,person);await save(i);
          });
          row.addEventListener('dragend',()=>row.classList.remove('dragging','drag-over'));
        });
      }
    }
    function initials(name){return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
    function money(value){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(value)||0)}
    function openModal(content){modal.innerHTML=content;overlay.classList.add('open');modal.querySelector('.close').onclick=closeModal;overlay.onclick=e=>{if(e.target===overlay)closeModal()};modal.querySelector('input')?.focus()}
    function closeModal(){overlay.classList.remove('open');modal.innerHTML=''}
    function showError(text){const e=modal.querySelector('.error');e.textContent=text;e.style.display='block'}
    function personModal(i){openModal(`<div class="modal-head"><div><h2>Ajouter un personnel</h2><p>Ajoutez une personne au tableau de ${months[i]}.</p></div><button class="close">×</button></div><div class="error"></div><div class="field"><label for="personName">Nom et prénom</label><input id="personName" placeholder="Ex. Camille Martin" maxlength="60" autocomplete="name"></div><button class="primary" id="savePerson">Ajouter au tableau</button>`);modal.querySelector('#savePerson').onclick=async()=>{const n=modal.querySelector('#personName').value.trim();if(!n)return showError('Veuillez renseigner un nom.');const d=monthData(i);if(d.people.some(x=>x.name.toLowerCase()===n.toLowerCase()))return showError('Cette personne est déjà dans la liste.');d.people.push({name:n,quantities:[],paid:false,paymentMode:'',advance:0});await save(i);closeModal();toast('Personnel ajouté au tableau.')};modal.querySelector('#personName').onkeydown=e=>{if(e.key==='Enter')modal.querySelector('#savePerson').click()}}
    function productModal(i,index=null){const old=index===null?{name:'',price:''}:monthData(i).products[index];openModal(`<div class="modal-head"><div><h2>${index===null?'Ajouter un produit':'Modifier le produit'}</h2><p>Le nom et le prix apparaîtront en haut du tableau.</p></div><button class="close">×</button></div><div class="error"></div><div class="field"><label for="productName">Nom du produit</label><input id="productName" placeholder="Ex. Café" maxlength="45" value="${esc(old.name)}"></div><div class="field"><label for="productPrice">Prix (€)</label><input id="productPrice" type="number" min="0" step="0.01" placeholder="2,50" value="${old.price!==''?esc(old.price):''}"></div><button class="primary" id="saveProduct">${index===null?'Ajouter au tableau':'Enregistrer le prix'}</button>`);modal.querySelector('#saveProduct').onclick=async()=>{const name=modal.querySelector('#productName').value.trim(),raw=modal.querySelector('#productPrice').value,price=Number(raw);if(!name)return showError('Veuillez renseigner le nom du produit.');if(raw===''||!Number.isFinite(price)||price<0)return showError('Veuillez saisir un prix valide.');const d=monthData(i);if(index===null&&d.products.some(x=>x.name.toLowerCase()===name.toLowerCase()))return showError('Ce produit existe déjà dans ce mois.');if(index===null)d.products.push({name,price});else d.products[index]={name,price};await save(i);closeModal();toast(index===null?'Produit ajouté au tableau.':'Produit mis à jour.')};modal.querySelector('#productName').onkeydown=e=>{if(e.key==='Enter')modal.querySelector('#saveProduct').click()}}
    function paymentModeModal(i,personIndex){openModal(`<div class="modal-head"><div><h2>Ajouter un mode de paiement</h2><p>Cette option sera proposée dans tous les mois.</p></div><button class="close">×</button></div><div class="error"></div><div class="field"><label for="paymentModeName">Nom du mode</label><input id="paymentModeName" placeholder="Ex. Espèces, carte, virement" maxlength="40"></div><button class="primary" id="savePaymentMode">Ajouter ce mode</button>`);modal.querySelector('#savePaymentMode').onclick=async()=>{const name=modal.querySelector('#paymentModeName').value.trim();if(!name)return showError('Veuillez saisir un nom pour le mode de paiement.');if(cache.paymentModes.some(x=>x.toLowerCase()===name.toLowerCase()))return showError('Ce mode de paiement existe déjà.');cache.paymentModes.push(name);monthData(i).people[personIndex].paymentMode=name;try{await setDoc(doc(db,'system','setup'),{paymentModes:cache.paymentModes},{merge:true});await save(i);closeModal();month(i);toast('Mode de paiement ajouté.')}catch(e){console.error(e);showError(errorText(e))}};modal.querySelector('#paymentModeName').onkeydown=e=>{if(e.key==='Enter')modal.querySelector('#savePaymentMode').click()}}
    async function adminModal(){openModal(`<div class="modal-head"><div><h2>Espace admin</h2><p>Connexion réservée à l’administrateur.</p></div><button class="close">×</button></div><div class="error"></div><div class="field"><label for="email">Adresse e-mail</label><input id="email" type="email" value="${ADMIN_EMAIL}" readonly autocomplete="username"></div><div class="field"><label for="password">Mot de passe</label><input id="password" type="password" placeholder="Votre mot de passe" autocomplete="current-password"></div><button class="primary" id="authSubmit">Se connecter</button><p class="helper">Le compte administrateur est créé depuis Firebase Authentication.</p>`);modal.querySelector('#authSubmit').onclick=async()=>{const pass=modal.querySelector('#password').value;if(!pass)return showError('Veuillez saisir votre mot de passe.');try{const credential=await signInWithEmailAndPassword(auth,ADMIN_EMAIL,pass);if(!credential.user.emailVerified){await sendEmailVerification(credential.user);await signOut(auth);return showError('Un e-mail de vérification vient de vous être envoyé. Ouvrez-le, puis reconnectez-vous.')}await setDoc(doc(db,'system','setup'),{adminEmail:ADMIN_EMAIL},{merge:true});closeModal();toast('Connexion réussie.')}catch(e){console.error(e);showError(errorText(e))}}}
    function updateAdminButton(){const b=document.querySelector('#adminButton');document.querySelector('#adminStatus').textContent=logged?' · Connecté':'';b.onclick=async()=>{if(auth.currentUser){await signOut(auth);logged=false;currentMonth===null?home():month(currentMonth);toast('Vous êtes déconnecté.')}else adminModal().catch(e=>toast(errorText(e)))}}
    function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000)}
    document.querySelector('#brandHome').onclick=e=>{e.preventDefault();home()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeModal()});onAuthStateChanged(auth,user=>{logged=!!user&&user.emailVerified&&user.email?.toLowerCase()===ADMIN_EMAIL;updateAdminButton();if(currentMonth!==null)month(currentMonth)});home();
  </script>
