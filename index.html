    function productModal(i,index=null){const old=index===null?{name:'',price:''}:monthData(i).products[index];openModal(`<div class="modal-head"><div><h2>${index===null?'Ajouter un produit':'Modifier le produit'}</h2><p>Le nom et le prix apparaîtront en haut du tableau.</p></div><button class="close">×</button></div><div class="error"></div><div class="field"><label for="productName">Nom du produit</label><input id="productName" placeholder="Ex. Café" maxlength="45" value="${esc(old.name)}"></div><div class="field"><label for="productPrice">Prix (€)</label><input id="productPrice" type="number" min="0" step="0.01" placeholder="2,50" value="${old.price!==''?esc(old.price):''}"></div><button class="primary" id="saveProduct">${index===null?'Ajouter au tableau':'Enregistrer le prix'}</button>`);modal.querySelector('#saveProduct').onclick=async()=>{const name=modal.querySelector('#productName').value.trim(),raw=modal.querySelector('#productPrice').value,price=Number(raw);if(!name)return showError('Veuillez renseigner le nom du produit.');if(raw===''||!Number.isFinite(price)||price<0)return showError('Veuillez saisir un prix valide.');const d=monthData(i);if(index===null&&d.products.some(x=>x.name.toLowerCase()===name.toLowerCase()))return showError('Ce produit existe déjà dans ce mois.');if(index===null)d.products.push({name,price});else d.products[index]={name,price};await save(i);closeModal();toast(index===null?'Produit ajouté au tableau.':'Produit mis à jour.')};modal.querySelector('#productName').onkeydown=e=>{if(e.key==='Enter')modal.querySelector('#saveProduct').click()}}
    function paymentModeModal(i,personIndex){openModal(`<div class="modal-head"><div><h2>Ajouter un mode de paiement</h2><p>Cette option sera proposée dans tous les mois.</p></div><button class="close">×</button></div><div class="error"></div><div class="field"><label for="paymentModeName">Nom du mode</label><input id="paymentModeName" placeholder="Ex. Espèces, carte, virement" maxlength="40"></div><button class="primary" id="savePaymentMode">Ajouter ce mode</button>`);modal.querySelector('#savePaymentMode').onclick=async()=>{const name=modal.querySelector('#paymentModeName').value.trim();if(!name)return showError('Veuillez saisir un nom pour le mode de paiement.');if(cache.paymentModes.some(x=>x.toLowerCase()===name.toLowerCase()))return showError('Ce mode de paiement existe déjà.');cache.paymentModes.push(name);monthData(i).people[personIndex].paymentMode=name;try{await setDoc(doc(db,'system','setup'),{paymentModes:cache.paymentModes},{merge:true});await save(i);closeModal();month(i);toast('Mode de paiement ajouté.')}catch(e){console.error(e);showError(errorText(e))}};modal.querySelector('#paymentModeName').onkeydown=e=>{if(e.key==='Enter')modal.querySelector('#savePaymentMode').click()}}
    function paymentMethodsModal(){openModal(`<div class="modal-head"><div><h2>Moyens de paiement</h2><p>Pour régler votre facture, choisissez l’un des moyens suivants.</p></div><button class="close">×</button></div><div class="payment-methods"><section class="payment-method-card"><h3>PayPal</h3><div class="payment-copy-row"><a href="mailto:popotemontech@gmail.com">popotemontech@gmail.com</a><button class="payment-copy-button" type="button" data-copy-payment="popotemontech@gmail.com" data-copy-label="Adresse PayPal">Copier</button></div></section><section class="payment-method-card"><h3>En liquide</h3><p>Règlement en espèces.</p></section><section class="payment-method-card"><h3>Virement bancaire · SUMERIA</h3><p>IBAN</p><div class="payment-copy-row"><span class="payment-iban">FR76 1759 8000 0100 0331 6848 286</span><button class="payment-copy-button" type="button" data-copy-payment="FR7617598000010003316848286" data-copy-label="IBAN">Copier</button></div></section></div>`);modal.querySelectorAll("[data-copy-payment]").forEach(button=>button.onclick=()=>copyPaymentValue(button.dataset.copyPayment,button.dataset.copyLabel))}    async function copyPaymentValue(value,label){try{await navigator.clipboard.writeText(value);toast(label+" copié.")}catch(error){console.error(error);toast("La copie a échoué. Sélectionnez le texte pour le copier.")}}    function popotierModal(){openModal(`<div class="modal-head"><div><h2>Le Popotier</h2><p>Vos contacts pour Popote & Cie.</p></div><button class="close">×</button></div><div class="contact-info"><div class="contact-link"><span class="contact-icon">👤</span><span>Gnd VALENTIN</span></div><a class="contact-link" href="tel:+33632449701"><span class="contact-icon">☎</span><span>06.32.44.97.01</span></a><a class="contact-link" href="mailto:popotemontech@gmail.com"><span class="contact-icon">✉</span><span>popotemontech@gmail.com</span></a></div>`)}
    async function adminModal(){openModal(`<div class="modal-head"><div><h2>Espace admin</h2><p>Connexion réservée à l’administrateur.</p></div><button class="close">×</button></div><div class="error"></div><div class="field"><label for="email">Adresse e-mail</label><input id="email" type="email" value="${ADMIN_EMAIL}" readonly autocomplete="username"></div><div class="field"><label for="password">Mot de passe</label><input id="password" type="password" placeholder="Votre mot de passe" autocomplete="current-password"></div><button class="primary" id="authSubmit">Se connecter</button><p class="helper">Le compte administrateur est créé depuis Firebase Authentication.</p>`);modal.querySelector('#authSubmit').onclick=async()=>{const pass=modal.querySelector('#password').value;if(!pass)return showError('Veuillez saisir votre mot de passe.');try{const credential=await signInWithEmailAndPassword(auth,ADMIN_EMAIL,pass);if(!credential.user.emailVerified){await sendEmailVerification(credential.user);await signOut(auth);return showError('Un e-mail de vérification vient de vous être envoyé. Ouvrez-le, puis reconnectez-vous.')}await setDoc(doc(db,'system','setup'),{adminEmail:ADMIN_EMAIL},{merge:true});closeModal();toast('Connexion réussie.')}catch(e){console.error(e);showError(errorText(e))}}}
    function updateAdminButton(){const b=document.querySelector('#adminButton');document.querySelector('#adminStatus').textContent=logged?' · Connecté':'';b.onclick=async()=>{if(auth.currentUser){await signOut(auth);logged=false;currentMonth===null?home():month(currentMonth);toast('Vous êtes déconnecté.')}else adminModal().catch(e=>toast(errorText(e)))}}
    function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000)}
    document.querySelector('#brandHome').onclick=e=>{e.preventDefault();home()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeModal()});onAuthStateChanged(auth,user=>{logged=!!user&&user.emailVerified&&user.email?.toLowerCase()===ADMIN_EMAIL;updateAdminButton();if(currentMonth!==null)month(currentMonth);else if(app.querySelector('#yearButton'))home()});home();
  </script>
