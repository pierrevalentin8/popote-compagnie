<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2e8">
  <title>Popote & Cie — Le carnet du bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f6f2e8;--white:#fffdf8;--ink:#25372c;--muted:#758075;--green:#365844;--lime:#d7e5a4;--line:#e8e5dc;--orange:#e8915e;--shadow:0 12px 32px #25372c0d}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}
    .topbar{height:76px;padding:0 max(28px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e7e2d7;background:#f6f2e8eF}
    .brand{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none;font-weight:700;font-size:17px;letter-spacing:-.4px}.brand-mark{width:38px;height:38px;border-radius:13px;background:var(--green);display:grid;place-items:center;color:white;font-size:20px}.brand small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
    .admin-btn,.secondary,.primary,.year-button{border:0;border-radius:12px;font-weight:600;transition:.18s ease}.admin-btn{padding:10px 16px;background:var(--white);color:var(--ink);border:1px solid var(--line);font-size:13px}.admin-btn:hover,.secondary:hover{border-color:#b8c9af;transform:translateY(-1px)}
    main{max-width:1180px;margin:auto;padding:36px 28px 80px}.crumb{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;margin:3px 0 28px}.crumb button{color:var(--muted);border:0;background:none;padding:0}.crumb button:hover{color:var(--green)}.crumb b{color:var(--ink);font-weight:600}
    .hero{position:relative;overflow:hidden;min-height:350px;border-radius:26px;padding:50px 56px;display:flex;align-items:center;background:var(--green);color:#fffdf8;margin-bottom:48px}.hero:after{content:'✳';position:absolute;font-size:390px;line-height:1;color:#ffffff0b;right:38px;top:-65px;transform:rotate(-13deg)}.hero-copy{position:relative;z-index:1;max-width:575px}.eyebrow{display:flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:#d9e6bd;margin-bottom:18px}.eyebrow:before{content:'';width:24px;height:1px;background:#d9e6bd}.hero h1{font:700 clamp(37px,5vw,60px)/1.08 'Playfair Display',serif;letter-spacing:-1.5px;margin:0 0 15px}.hero p{font-size:15px;color:#e1e9df;line-height:1.7;margin:0 0 29px;max-width:425px}.year-button{display:flex;align-items:center;gap:19px;padding:15px 20px;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px}.year-button span{font-size:19px}.year-button:hover,.primary:hover{transform:translateY(-2px);box-shadow:0 9px 18px #1d34272e}
    .section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:21px}.section-head h2{font:700 27px 'Playfair Display',serif;margin:0 0 5px}.section-head p{margin:0;color:var(--muted);font-size:13px}.badge{font-size:11px;letter-spacing:.4px;color:var(--green);background:#e5eadb;border-radius:30px;padding:8px 12px;font-weight:700}
    .months{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.month-card{display:flex;align-items:center;justify-content:space-between;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:15px;padding:18px 19px;min-height:78px;color:var(--ink);box-shadow:0 3px 8px #263b2c04;transition:.18s}.month-card:hover{transform:translateY(-2px);border-color:#bac9a9;box-shadow:var(--shadow)}.month-card strong{font-size:15px;font-weight:600;text-transform:capitalize}.month-num{color:#a2aa9e;font-size:11px;font-weight:600}.month-arrow{font-size:16px;color:#9da998}
    .page-title{display:flex;justify-content:space-between;align-items:start;margin:8px 0 27px}.page-title h1{font:700 42px 'Playfair Display',serif;margin:0 0 7px;text-transform:capitalize;letter-spacing:-.8px}.page-title p{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:10px}.primary{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:white;padding:12px 17px;font-size:13px}.secondary{display:inline-flex;align-items:center;gap:8px;background:var(--white);color:var(--ink);border:1px solid var(--line);padding:11px 15px;font-size:13px}
    .sheet-wrap{background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.sheet-top{padding:19px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.sheet-top h2{font-size:14px;margin:0;font-weight:700}.sheet-top span{color:var(--muted);font-size:11px}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:14px 17px;text-align:left;font-size:13px}th{background:#f8f7f1;color:#6f796e;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700}td:first-child,th:first-child{width:245px}tr:last-child td{border-bottom:0}th:last-child,td:last-child{border-right:0}.person-cell{display:flex;align-items:center;gap:10px;font-weight:600}.avatar{height:29px;width:29px;border-radius:50%;display:grid;place-items:center;color:var(--green);background:#e7ecd9;font-size:11px;font-weight:700}.price{color:var(--green);font-weight:600}.empty{padding:56px 20px;text-align:center;color:var(--muted)}.empty-icon{width:45px;height:45px;border-radius:15px;background:#f0f1e8;margin:0 auto 12px;display:grid;place-items:center;font-size:20px}.empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}.empty p{margin:0;font-size:12px}
    .notice{border:1px solid #e7e6d5;background:#f8f7ef;border-radius:12px;padding:13px 16px;color:#667363;font-size:12px;line-height:1.6;margin-top:18px}
    .overlay{position:fixed;inset:0;background:#192a20a3;display:none;align-items:center;justify-content:center;padding:20px;z-index:10;backdrop-filter:blur(3px)}.overlay.open{display:flex}.modal{width:min(100%,410px);background:var(--white);border-radius:20px;padding:28px;box-shadow:0 25px 90px #14251c40;animation:appear .18s ease}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.modal-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:23px}.modal h2{font:700 25px 'Playfair Display',serif;margin:0 0 5px}.modal-head p{margin:0;color:var(--muted);font-size:12px}.close{border:0;background:#f0f0e9;border-radius:9px;width:32px;height:32px;font-size:19px;color:#667363}.field{margin:0 0 15px}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:7px}.field input{width:100%;height:44px;border:1px solid #dddcd2;border-radius:10px;background:white;padding:0 12px;color:var(--ink);outline:none;font-size:13px}.field input:focus{border-color:#789379;box-shadow:0 0 0 3px #36584412}.field input[readonly]{background:#f6f5ef;color:#69746a}.modal .primary{width:100%;justify-content:center;margin-top:6px;padding:13px}.error{font-size:12px;color:#b54135;background:#fbefeb;padding:10px;border-radius:9px;margin:0 0 13px;display:none}.helper{color:var(--muted);font-size:11px;line-height:1.5;margin:12px 0 0}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#25372c;color:white;padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:750px){main{padding:25px 18px 60px}.hero{padding:38px 28px;min-height:320px;margin-bottom:37px}.hero:after{right:-95px;font-size:310px;top:7px}.months{grid-template-columns:repeat(2,1fr);gap:10px}.month-card{min-height:68px;padding:14px}.section-head h2{font-size:23px}.topbar{padding:0 18px}.page-title{display:block}.page-title h1{font-size:35px}.actions{margin-top:19px;flex-wrap:wrap}.actions button{flex:1;justify-content:center}.badge{display:none}}
    @media(max-width:390px){.months{grid-template-columns:1fr}.hero{padding:33px 23px}.hero h1{font-size:38px}.admin-btn{padding:9px 11px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="#" id="brandHome"><span class="brand-mark">✳</span><span>Popote & Cie<small>Le carnet du bar</small></span></a><button class="admin-btn" id="adminButton">Admin <span id="adminStatus"></span></button></header>
  <main id="app"></main>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
    import { doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
    const ADMIN_EMAIL='pierre.valentin8@gmail.com';
    const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    const app=document.querySelector('#app'), overlay=document.querySelector('#overlay'), modal=document.querySelector('#modal');
    const cache={months:{}};let logged=false,currentMonth=null,unsubscribeMonth=null,monthsExpanded=false;
    const isAdmin=()=>auth.currentUser?.email?.toLowerCase()===ADMIN_EMAIL&&auth.currentUser.emailVerified;
    const monthData=i=>cache.months[i]||(cache.months[i]={people:[],products:[]});
    const monthRef=i=>doc(db,'months',String(i+1).padStart(2,'0'));
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function errorText(e){if(e.code==='auth/email-already-in-use')return 'Un compte existe déjà pour cette adresse. Connectez-vous.';if(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password')return 'Adresse e-mail ou mot de passe incorrect.';if(e.code==='auth/too-many-requests')return 'Trop de tentatives. Réessayez plus tard.';if(e.code==='auth/operation-not-allowed')return 'Activez la connexion par e-mail et mot de passe dans Firebase Authentication.';if(e.code==='permission-denied')return 'Accès refusé. Vérifiez les règles Firestore et le compte administrateur.';return 'Une erreur Firebase est survenue. Vérifiez la configuration du projet puis réessayez.'}
    async function save(i){try{await setDoc(monthRef(i),monthData(i));}catch(e){console.error(e);toast(errorText(e))}}
    async function loadMonth(i){unsubscribeMonth?.();const s=await getDoc(monthRef(i));cache.months[i]=s.exists()?{people:Array.isArray(s.data().people)?s.data().people:[],products:Array.isArray(s.data().products)?s.data().products:[]}:{people:[],products:[]};month(i);unsubscribeMonth=onSnapshot(monthRef(i),snap=>{cache.months[i]=snap.exists()?{people:Array.isArray(snap.data().people)?snap.data().people:[],products:Array.isArray(snap.data().products)?snap.data().products:[]}:{people:[],products:[]};if(currentMonth===i)month(i)},e=>toast(errorText(e)))}
    async function copyFromPrevious(i,kind){if(i===0)return;try{const snap=await getDoc(monthRef(i-1));const previous=snap.exists()?snap.data()[kind]:[];if(!Array.isArray(previous)||!previous.length)return toast(`Aucun ${kind==='people'?'personnel':'produit'} à copier depuis ${months[i-1]}.`);const current=monthData(i)[kind];let added=0;for(const item of previous){const label=kind==='people'?item:item?.name;if(!label||current.some(x=>(kind==='people'?x:x.name).toLowerCase()===label.toLowerCase()))continue;current.push(kind==='people'?item:{name:item.name,price:Number(item.price)||0});added++}await save(i);toast(added?`${added} ${kind==='people'?'personne(s)':'produit(s)'} ajouté(s) depuis ${months[i-1]}.`:'Tout est déjà présent dans ce mois.') }catch(e){console.error(e);toast(errorText(e))}}
    function home(){unsubscribeMonth?.();unsubscribeMonth=null;currentMonth=null;app.innerHTML=`<div class="hero"><div class="hero-copy"><div class="eyebrow">La vie du bar, bien rangée</div><h1>Les bons comptes<br>font les bonnes<br>soirées.</h1><p>Le carnet de bord de l’équipe : retrouvez les personnes et les produits, mois après mois.</p><button class="year-button" id="yearButton" aria-expanded="${monthsExpanded}">2026 <span>${monthsExpanded?'⌄':'→'}</span></button></div></div>${monthsExpanded?`<div class="section-head"><div><h2>Une année au comptoir</h2><p>Choisissez un mois pour consulter son tableau.</p></div><span class="badge">ANNÉE 2026</span></div><div class="months">${months.map((m,i)=>`<button class="month-card" data-month="${i}"><strong>${m}</strong><span class="month-num">${String(i+1).padStart(2,'0')} <span class="month-arrow">↗</span></span></button>`).join('')}</div>`:''}${!logged?'<div class="notice">Consultation ouverte à tous. La gestion du carnet est réservée à l’administrateur.</div>':''}`;document.querySelector('#yearButton').onclick=()=>{monthsExpanded=!monthsExpanded;home();if(monthsExpanded)document.querySelector('.section-head').scrollIntoView({behavior:'smooth',block:'start'})};document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>loadMonth(+b.dataset.month));updateAdminButton()}
    function month(i){currentMonth=i;const d=monthData(i),editable=isAdmin();logged=editable;app.innerHTML=`<div class="crumb"><button id="goHome">Accueil</button><span>›</span><b>2026</b><span>›</span><b style="text-transform:capitalize">${months[i]}</b></div><div class="page-title"><div><h1>${months[i]} <span style="color:#9ba397">2026</span></h1><p>Le tableau de bord du mois au bar.</p></div>${editable?`<div class="actions"><button class="secondary" id="copyPeople" ${i===0?'disabled title="Aucun mois précédent dans 2026"':''}>Copier le personnel</button><button class="secondary" id="copyProducts" ${i===0?'disabled title="Aucun mois précédent dans 2026"':''}>Copier les produits</button><button class="secondary" id="addPerson"><span>＋</span> Ajouter un personnel</button><button class="primary" id="addProduct"><span>＋</span> Ajouter produit</button></div>`:''}</div><section class="sheet-wrap"><div class="sheet-top"><h2>Personnel & produits</h2><span>${d.people.length} personne${d.people.length!==1?'s':''} · ${d.products.length} produit${d.products.length!==1?'s':''}</span></div><div id="sheet"></div></section>${!editable?'<div class="notice">Connectez-vous en tant qu’administrateur pour ajouter ou modifier des éléments.</div>':''}`;document.querySelector('#goHome').onclick=home;if(editable){document.querySelector('#addPerson').onclick=()=>personModal(i);document.querySelector('#addProduct').onclick=()=>productModal(i);document.querySelector('#copyPeople').onclick=()=>copyFromPrevious(i,'people');document.querySelector('#copyProducts').onclick=()=>copyFromPrevious(i,'products')}renderSheet(i);updateAdminButton()}
    function renderSheet(i){const d=monthData(i),s=document.querySelector('#sheet');if(!s)return;if(!d.people.length&&!d.products.length){s.innerHTML='<div class="empty"><div class="empty-icon">▦</div><strong>Le tableau est encore vide</strong><p>Ajoutez du personnel et des produits pour commencer.</p></div>';return}const cols=d.products.length?d.products.map((p,j)=>`<th>${esc(p.name)}${isAdmin()?` <button data-edit="${j}" title="Modifier le prix" style="border:0;background:none;color:#87917f">✎</button><button data-del-product="${j}" title="Supprimer ce produit" style="border:0;background:none;color:#a05b50">×</button>`:''}<br><span style="font-weight:500;text-transform:none;letter-spacing:0;color:#899286">${money(p.price)}</span></th>`).join(''):'<th>Produits</th>';s.innerHTML=`<div class="table-scroll"><table><thead><tr><th>Personnel</th>${cols}</tr></thead><tbody>${d.people.length?d.people.map((p,pi)=>`<tr><td><div class="person-cell"><span class="avatar">${esc(initials(p))}</span>${esc(p)}${isAdmin()?` <button data-del-person="${pi}" title="Supprimer cette personne" style="margin-left:auto;border:0;background:none;color:#a05b50">×</button>`:''}</div></td>${d.products.length?d.products.map(()=>'<td style="color:#c5c8be">—</td>').join(''):'<td style="color:#a0a69b">Aucun produit pour le moment</td>'}</tr>`).join(''):`<tr><td colspan="${Math.max(1,d.products.length+1)}" style="color:#9aa194;padding:25px">Aucun membre du personnel pour le moment.</td></tr>`}</tbody></table></div>`;s.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>productModal(i,+b.dataset.edit));s.querySelectorAll('[data-del-person]').forEach(b=>b.onclick=async()=>{d.people.splice(+b.dataset.delPerson,1);await save(i)});s.querySelectorAll('[data-del-product]').forEach(b=>b.onclick=async()=>{d.products.splice(+b.dataset.delProduct,1);await save(i)})}
    function initials(name){return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
    function money(value){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(value)||0)}
    function openModal(content){modal.innerHTML=content;overlay.classList.add('open');modal.querySelector('.close').onclick=closeModal;overlay.onclick=e=>{if(e.target===overlay)closeModal()};modal.querySelector('input')?.focus()}
    function closeModal(){overlay.classList.remove('open');modal.innerHTML=''}
    function showError(text){const e=modal.querySelector('.error');e.textContent=text;e.style.display='block'}
    function personModal(i){openModal(`<div class="modal-head"><div><h2>Ajouter un personnel</h2><p>Ajoutez une personne au tableau de ${months[i]}.</p></div><button class="close">×</button></div><div class="error"></div><div class="field"><label for="personName">Nom et prénom</label><input id="personName" placeholder="Ex. Camille Martin" maxlength="60" autocomplete="name"></div><button class="primary" id="savePerson">Ajouter au tableau</button>`);modal.querySelector('#savePerson').onclick=async()=>{const n=modal.querySelector('#personName').value.trim();if(!n)return showError('Veuillez renseigner un nom.');const d=monthData(i);if(d.people.some(x=>x.toLowerCase()===n.toLowerCase()))return showError('Cette personne est déjà dans la liste.');d.people.push(n);await save(i);closeModal();toast('Personnel ajouté au tableau.')};modal.querySelector('#personName').onkeydown=e=>{if(e.key==='Enter')modal.querySelector('#savePerson').click()}}
    function productModal(i,index=null){const old=index===null?{name:'',price:''}:monthData(i).products[index];openModal(`<div class="modal-head"><div><h2>${index===null?'Ajouter un produit':'Modifier le produit'}</h2><p>Le nom et le prix apparaîtront en haut du tableau.</p></div><button class="close">×</button></div><div class="error"></div><div class="field"><label for="productName">Nom du produit</label><input id="productName" placeholder="Ex. Café" maxlength="45" value="${esc(old.name)}"></div><div class="field"><label for="productPrice">Prix (€)</label><input id="productPrice" type="number" min="0" step="0.01" placeholder="2,50" value="${old.price!==''?esc(old.price):''}"></div><button class="primary" id="saveProduct">${index===null?'Ajouter au tableau':'Enregistrer le prix'}</button>`);modal.querySelector('#saveProduct').onclick=async()=>{const name=modal.querySelector('#productName').value.trim(),raw=modal.querySelector('#productPrice').value,price=Number(raw);if(!name)return showError('Veuillez renseigner le nom du produit.');if(raw===''||!Number.isFinite(price)||price<0)return showError('Veuillez saisir un prix valide.');const d=monthData(i);if(index===null&&d.products.some(x=>x.name.toLowerCase()===name.toLowerCase()))return showError('Ce produit existe déjà dans ce mois.');if(index===null)d.products.push({name,price});else d.products[index]={name,price};await save(i);closeModal();toast(index===null?'Produit ajouté au tableau.':'Produit mis à jour.')};modal.querySelector('#productName').onkeydown=e=>{if(e.key==='Enter')modal.querySelector('#saveProduct').click()}}
    async function adminModal(){openModal(`<div class="modal-head"><div><h2>Espace admin</h2><p>Connexion réservée à l’administrateur.</p></div><button class="close">×</button></div><div class="error"></div><div class="field"><label for="email">Adresse e-mail</label><input id="email" type="email" value="${ADMIN_EMAIL}" readonly autocomplete="username"></div><div class="field"><label for="password">Mot de passe</label><input id="password" type="password" placeholder="Votre mot de passe" autocomplete="current-password"></div><button class="primary" id="authSubmit">Se connecter</button><p class="helper">Le compte administrateur est créé depuis Firebase Authentication.</p>`);modal.querySelector('#authSubmit').onclick=async()=>{const pass=modal.querySelector('#password').value;if(!pass)return showError('Veuillez saisir votre mot de passe.');try{const credential=await signInWithEmailAndPassword(auth,ADMIN_EMAIL,pass);if(!credential.user.emailVerified){await sendEmailVerification(credential.user);await signOut(auth);return showError('Un e-mail de vérification vient de vous être envoyé. Ouvrez-le, puis reconnectez-vous.')}await setDoc(doc(db,'system','setup'),{adminEmail:ADMIN_EMAIL},{merge:true});closeModal();toast('Connexion réussie.')}catch(e){console.error(e);showError(errorText(e))}}}
    function updateAdminButton(){const b=document.querySelector('#adminButton');document.querySelector('#adminStatus').textContent=logged?' · Connecté':'';b.onclick=async()=>{if(auth.currentUser){await signOut(auth);logged=false;currentMonth===null?home():month(currentMonth);toast('Vous êtes déconnecté.')}else adminModal().catch(e=>toast(errorText(e)))}}
    function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000)}
    document.querySelector('#brandHome').onclick=e=>{e.preventDefault();home()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeModal()});onAuthStateChanged(auth,user=>{logged=!!user&&user.emailVerified&&user.email?.toLowerCase()===ADMIN_EMAIL;updateAdminButton();if(currentMonth!==null)month(currentMonth)});home();
  </script>
</body>
</html>
